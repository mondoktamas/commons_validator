include: package:lints/recommended.yaml

analyzer:
  exclude:
    # Its own package with its own dependencies, resolved by its own pub get.
    - tool/email_comparison/**
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    todo: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - prefer_single_quotes
    - unnecessary_lambdas
