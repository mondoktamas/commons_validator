name: commons_validator
description: A Dart port of the Apache Commons Validator routines - email, URL, domain, IP, IBAN, ISBN, ISIN, ISSN, credit card, check digit, number and date validators.
version: 0.1.0
repository: https://github.com/mondoktamas/commons_validator
issue_tracker: https://github.com/mondoktamas/commons_validator/issues
topics:
  - validation
  - validator
  - email
  - iban
  - check-digit

environment:
  sdk: ^3.6.0

dependencies:
  decimal: ^3.2.6
  # Deliberately loose: flutter_localizations pins intl to an exact version
  # (0.20.2 on Flutter 3.44), so requiring ^0.20.3 would make this package
  # unusable in any app that uses Flutter's own localizations.
  intl: ">=0.20.0 <0.21.0"
  unorm_dart: ^0.3.2

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.0
